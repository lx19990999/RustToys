[package]
name = "rusttoys"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v1", "v7"] }
regex = "1"
html-escape = "0.2"
urlencoding = "2"
percent-encoding = "2"
flate2 = "1"
chrono = "0.4"
rand = "0.8"
cron = "0.12"
pulldown-cmark = "0.10"
xml-rs = "0.8"
quick-xml = "0.31"
jsonwebtoken = "9"
qrcode-generator = "4"
rqrr = "0.7"
image = "0.25"
rfd = "0.15"
arboard = "3"
x509-parser = "0.16"
dark-light = "1"
dirs = "6"
