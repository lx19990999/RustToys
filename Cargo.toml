[package]
name = "rusttoys"
version = "0.1.0"
edition = "2021"
description = "A Swiss Army knife for developers"
license = "GPL-3.0"
repository = "https://github.com/lx19990999/RustToys"

[package.metadata.deb]
assets = [
    ["target/release/rusttoys", "usr/bin/", "755"],
    ["assets/NotoSansSC-Regular.ttf", "usr/share/rusttoys/", "644"],
    ["assets/FONT-LICENSE", "usr/share/rusttoys/", "644"],
]
section = "utils"
priority = "optional"
depends = "libgtk-3-0, libwebkit2gtk-4.1-0"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/rusttoys", dest = "/usr/bin/rusttoys", mode = "755" },
    { source = "assets/NotoSansSC-Regular.ttf", dest = "/usr/share/rusttoys/NotoSansSC-Regular.ttf", mode = "644" },
    { source = "assets/FONT-LICENSE", dest = "/usr/share/rusttoys/FONT-LICENSE", mode = "644" },
]

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
md-5 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v1", "v7"] }
regex = "1"
html-escape = "0.2"
urlencoding = "2"
percent-encoding = "2"
flate2 = "1"
chrono = "0.4"
rand = "0.8"
cron = "0.12"
pulldown-cmark = "0.10"
xml-rs = "0.8"
quick-xml = "0.31"
jsonwebtoken = "9"
qrcode-generator = "4"
rqrr = "0.7"
image = "0.25"
rfd = "0.15"
arboard = "3"
x509-parser = "0.16"
dark-light = "1"
dirs = "6"
aes = "0.8"
des = "0.8"
rsa = "0.9"
