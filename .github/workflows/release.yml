name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Build release
        run: cargo build --release

      - name: Create macOS bundle
        run: |
          mkdir -p RustToys.app/Contents/MacOS
          mkdir -p RustToys.app/Contents/Resources
          cp target/release/rusttoys RustToys.app/Contents/MacOS/RustToys
          cp assets/NotoSansSC-Regular.ttf RustToys.app/Contents/Resources/
          cp assets/FONT-LICENSE RustToys.app/Contents/Resources/
          cp assets/icon.png RustToys.app/Contents/Resources/

          cat > RustToys.app/Contents/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>RustToys</string>
              <key>CFBundleDisplayName</key>
              <string>RustToys</string>
              <key>CFBundleIdentifier</key>
              <string>com.rusttoys.app</string>
              <key>CFBundleVersion</key>
              <string>${{ github.ref_name }}</string>
              <key>CFBundleShortVersionString</key>
              <string>${{ github.ref_name }}</string>
              <key>CFBundleExecutable</key>
              <string>RustToys</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.15</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          PLIST

      - name: Package macOS zip
        run: zip -ry RustToys-macos.zip RustToys.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustToys-macos
          path: RustToys-macos.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf dpkg-dev rpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Build release
        run: cargo build --release

      # .deb package
      - name: Install cargo-deb
        run: cargo install cargo-deb

      - name: Build .deb
        run: cargo deb

      - name: Copy .deb artifact
        run: cp target/debian/*.deb . || cp target/release/*.deb .

      # .rpm package
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm

      - name: Build .rpm
        run: cargo generate-rpm

      - name: Copy .rpm artifact
        run: cp target/generate-rpm/*.rpm . 2>/dev/null || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RustToys-linux
          path: |
            *.deb
            *.rpm

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Set version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml

      - name: Build release
        run: cargo build --release

      - name: Package Windows zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-zip
          Copy-Item target/release/rusttoys.exe dist-zip/
          Copy-Item assets/NotoSansSC-Regular.ttf dist-zip/
          Copy-Item assets/FONT-LICENSE dist-zip/
          Copy-Item assets/icon.png dist-zip/
          Compress-Archive -Path dist-zip/* -DestinationPath "RustToys-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: RustToys-windows
          path: |
            RustToys-*-windows-x64.zip

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp dist/RustToys-macos/*.zip release/
          cp dist/RustToys-linux/*.deb release/
          cp dist/RustToys-linux/*.rpm release/ 2>/dev/null || true
          cp dist/RustToys-windows/*.zip release/
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
